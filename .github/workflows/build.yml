yaml
name: Build VST3
on:
  workflow_dispatch:
  push:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target BBD_SCF04_Model_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: SCF04-VST3-${{ matrix.os }}
          path: build/BBD_SCF04_Model_artefacts
